revolte:
  version: '1'
  project: "excel to app"
  appName: onecliqapp
  env:
    preview:
      services:
        rid_1:
          type: WEB_APP
          entryPoint: src/app/page.tsx
          properties:
            indexPage: index.html
            errorPage: 404.html
    qa:
      branch: qa
      services:
        rid_1:
          type: WEB_APP
          entryPoint: src/app/page.tsx
          properties:
            indexPage: index.html
            errorPage: 404.html
    staging:
      branch: staging
      services:
        rid_1:
          type: WEB_APP
          entryPoint: src/app/page.tsx
          properties:
            indexPage: index.html
            errorPage: 404.html
    production:
      branch: main
      services:
        rid_1:
          type: WEB_APP
          entryPoint: src/app/page.tsx
          properties:
            indexPage: index.html
            errorPage: 404.html
